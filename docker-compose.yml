# Postgres local para el backend de prueba. Datos inventados, nada real.
# Levantar:  docker compose up -d
# La base arranca VACÍA: el esquema lo crea el backend con POST /api/db/migrar
# (scripts en actos_backend/Migraciones/Scripts).
# Borrar todo y empezar de cero:  POST /api/db/regenerar?confirmar=true   (solo en Development)
services:
  postgres:
    image: postgres:17
    container_name: actos_postgres
    environment:
      POSTGRES_DB: actos_prueba
      POSTGRES_USER: actos
      POSTGRES_PASSWORD: actos_dev
    ports:
      - "5433:5432"   # 5433 para no chocar con un Postgres instalado en la máquina
    volumes:
      - actos_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  actos_pgdata:
